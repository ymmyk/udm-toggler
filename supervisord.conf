[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log

[program:gunicorn]
command=gunicorn udmtoggler.wsgi:application --bind 0.0.0.0:8000
directory=/app
autostart=true
autorestart=true

[program:celery]
command=celery -A udmtoggler worker --loglevel=info  --beat --scheduler django
directory=/app
autostart=true
autorestart=true
